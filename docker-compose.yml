version: "3.9"

services:

  app:
    environment:
      - TZ=Europe/Samara
      - WEBHOOK_QUEUE_DIR=/var/lib/paymentsbot/incoming-webhooks

    build: .

    restart: unless-stopped

    volumes:
      - payment_webhook_queue:/var/lib/paymentsbot/incoming-webhooks

    env_file:
      - .env

    expose:
      - "8080"

    networks:
      - web
      - vnutri_net

  miniapp:
    build:
      context: ./miniapp
      args:
        VITE_API_URL: "/api/miniapp"

    restart: unless-stopped

    expose:
      - "80"

    networks:
      - web

  caddy:
    image: caddy:latest

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./.env:/app/.env:ro

    depends_on:
      - app
      - miniapp

    networks:
      - web
      - vnutri_net

  alloy:
    image: grafana/alloy:v1.21.0

    profiles:
      - observability

    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    restart: unless-stopped

    environment:
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_LOKI_TOKEN: ${GRAFANA_CLOUD_LOKI_TOKEN:-}

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/snap/docker/common/var-lib-docker/containers:/var/lib/docker/containers:ro

    networks:
      - web

networks:

  web:

  vnutri_net:
    external: true
    name: vnutri-telegram-bot_default

volumes:

  caddy_data:

  caddy_config:

  alloy_data:

  payment_webhook_queue:
